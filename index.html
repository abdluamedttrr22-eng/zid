<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زاد|ZAD Kitchen</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-color: #f1f1f1;
            --text-muted: #aaa;
            --danger: #ff4d4d;
            --success: #28a745;
            --info: #17a2b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 110px;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow: hidden;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .splash-content {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            padding: 0 10px;
        }

        .smoke-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 320px;
            pointer-events: none;
            z-index: 1;
            filter: blur(8px);
            opacity: 0.75;
        }

        .smoke-wisp {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 60px;
            height: 100%;
            background: linear-gradient(to top, rgba(255,255,255,0) 0%, rgba(212, 175, 55, 0.2) 25%, rgba(255, 255, 255, 0.45) 60%, rgba(255,255,255,0) 100%);
            border-radius: 50% 50% 30% 30%;
            transform: translateX(-50%);
            animation: elegantSmoke 5s infinite ease-in-out;
        }

        .smoke-wisp:nth-child(2) {
            width: 40px;
            animation-duration: 4s;
            animation-delay: 1.5s;
            left: 40%;
            background: linear-gradient(to top, rgba(255,255,255,0) 10%, rgba(255, 255, 255, 0.35) 50%, rgba(212, 175, 55, 0.15) 80%, rgba(255,255,255,0) 100%);
        }

        .smoke-wisp:nth-child(3) {
            width: 50px;
            animation-duration: 6s;
            animation-delay: 2.5s;
            left: 60%;
            background: linear-gradient(to top, rgba(255,255,255,0) 5%, rgba(200, 200, 200, 0.3) 40%, rgba(255,255,255,0) 100%);
        }

        @keyframes elegantSmoke {
            0% {
                transform: translateX(-50%) translateY(80px) scaleX(0.4) scaleY(0.6) rotate(0deg);
                opacity: 0;
            }
            30% {
                opacity: 0.6;
            }
            60% {
                transform: translateX(calc(-50% + 25px)) translateY(-60px) scaleX(1.4) scaleY(1.2) rotate(8deg);
                opacity: 0.5;
            }
            100% {
                transform: translateX(calc(-50% - 25px)) translateY(-160px) scaleX(2.2) scaleY(1.8) rotate(-12deg);
                opacity: 0;
            }
        }

        .splash-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.8), 0 0 5px rgba(0,0,0,1);
            white-space: nowrap;
            letter-spacing: 2px;
            position: relative;
            z-index: 3;
        }

        #main-app {
            display: none;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* تصميم قسم التواصل في أعلى الصفحة (أيقونات فقط) */
        .social-top-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 8px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--gold);
            border-radius: 8px;
        }

        .social-icon-btn {
            text-decoration: none;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #222;
            border: 1px solid var(--gold);
            overflow: hidden;
        }

        .social-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--gold);
        }

        .social-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .social-icon-btn:hover {
            transform: scale(1.1);
            background: var(--gold);
        }

        .social-icon-btn:hover svg {
            fill: #000;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 12px;
        }

        .brand-logo-container {
            width: 75px;
            height: 75px;
            margin: 0 auto 8px auto;
            border: 2px dashed var(--gold);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151515;
            position: relative;
        }

        .brand-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-logo-container span {
            font-size: 0.65rem;
            color: var(--gold);
            text-align: center;
            padding: 4px;
        }

        header h1 {
            color: var(--gold);
            font-size: 1.5rem;
            letter-spacing: 1px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .category-nav-container {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 900;
            padding: 8px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        .category-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--gold) #222;
        }

        .category-nav::-webkit-scrollbar {
            height: 5px;
        }

        .category-nav::-webkit-scrollbar-thumb {
            background-color: var(--gold);
            border-radius: 3px;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 12px;
            border-radius: 15px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--gold);
            color: #000;
        }

        .category-section {
            margin-bottom: 30px;
            scroll-margin-top: 70px;
        }

        .category-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid var(--gold);
            padding-right: 10px;
            margin-bottom: 15px;
        }

        .category-title {
            color: var(--gold);
            font-size: 1.3rem;
            margin: 0;
        }

        .edit-cat-btn {
            background: rgba(23, 162, 184, 0.9);
            color: #fff;
            border: 1px solid var(--info);
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: none;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .menu-item {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-img-container {
            width: 100%;
            height: 75px;
            background: #222;
            position: relative;
        }

        .item-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .admin-controls-overlay {
            position: absolute;
            bottom: 4px;
            left: 4px;
            display: flex;
            gap: 4px;
        }

        .admin-btn {
            background: rgba(0, 0, 0, 0.85);
            color: var(--gold);
            border: 1px solid var(--gold);
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            display: none;
        }

        .admin-btn.edit-item-btn {
            background: rgba(23, 162, 184, 0.9);
            color: #fff;
            border-color: var(--info);
        }

        .item-body {
            padding: 8px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item h3 {
            color: var(--gold);
            font-size: 0.82rem;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .menu-item p {
            color: var(--text-muted);
            font-size: 0.7rem;
            line-height: 1.2;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .price {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 0.8rem;
        }

        button {
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.72rem;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            border-top: 2px solid var(--gold);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .cart-info {
            font-size: 0.85rem;
            color: var(--gold);
        }

        .actions-container {
            display: flex;
            gap: 6px;
        }

        .view-cart-btn {
            background-color: #333;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .checkout-btn {
            background-color: var(--success);
            color: #fff;
            padding: 8px 14px;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 15px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--danger);
            color: #fff;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-title {
            color: var(--gold);
            font-size: 1.2rem;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            text-align: center;
        }

        .cart-items-list {
            margin-bottom: 12px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 6px;
        }

        .cart-item-details h4 {
            color: var(--text-color);
            font-size: 0.85rem;
        }

        .cart-item-details span {
            color: var(--gold-light);
            font-size: 0.75rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            background: var(--gold);
            color: #000;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            color: var(--gold);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
        }

        .location-btn {
            background-color: #0056b3;
            color: #fff;
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            font-size: 0.85rem;
        }

        .modal-totals {
            background: #151515;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .modal-totals div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .modal-totals .final-price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1rem;
            border-top: 1px solid #333;
            padding-top: 4px;
            margin-top: 4px;
        }

        .send-order-whatsapp, .save-item-btn {
            background-color: var(--success);
            color: #fff;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>

        function saveItemChanges() {
            let id = parseInt(document.getElementById('edit-item-id').value);
            let newName = document.getElementById('edit-item-name').value.trim();
            let newPrice = parseFloat(document.getElementById('edit-item-price').value);
            let newDesc = document.getElementById('edit-item-desc').value.trim();

            if (!newName || isNaN(newPrice)) {
                alert("يرجى إدخال اسم صحيح وسعر رقمي صالح.");
                return;
            }

            let item = menuItems.find(i => i.id === id);
            if (item) {
                item.name = newName;
                item.price = newPrice;
                item.desc = newDesc;
                
                let cartItem = cart.find(c => c.id === id);

                    cartItem.name = newName;
                    cartItem.price = newPrice;
                    updateCartUI();

                renderSections();
                closeEditModal();
            }
        }

        function addToCart(id) {
            let item = menuItems.find(i => i.id === id);
            let cartItem = cart.find(c => c.id === id);
            if(cartItem) cartItem.qty++;
            else cart.push({ ...item, qty: 1 });
            updateCartUI();
        }

        function changeQty(id, delta) {
            let cartItem = cart.find(c => c.id === id);
            if(cartItem) {
                cartItem.qty += delta;
                if(cartItem.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
            renderModalCartItems();
        }

        function updateCartUI() {
            let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            let itemsPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let finalTotal = itemsPrice + deliveryCost;

            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('cart-total').innerText = finalTotal;
        }

            let container = document.getElementById('modal-cart-items');

        function calculateDeliveryFee(dist) {
            if (dist <= 5) return 1000;
            if (dist <= 8) return 2000;
            return 3000;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            let R = 6371;
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function getMyLocation() {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم خاصية تحديد الموقع");
                return;
            }
            
            navigator.geolocation.getCurrentPosition(position => {
                let userLat = position.coords.latitude;
                let userLon = position.coords.longitude;
                distanceKm = calculateDistance(REST_LAT, REST_LON, userLat, userLon);
                deliveryCost = calculateDeliveryFee(distanceKm);
                
                userGpsLocationText = `موقع GPS: خط عرض ${userLat.toFixed(4)}, خط طول ${userLon.toFixed(4)} (المسافة: ${distanceKm.toFixed(1)} كم)`;
                document.getElementById('customer-address').value = userGpsLocationText;
                
                renderModalCartItems();
            }, error => {
                alert("تعذر تحديد الموقع تلقائياً. يرجى كتابة العنوان يدوياً.");
            }, { timeout: 5000, maximumAge: 60000, enableHighAccuracy: false });
        }

            msg += `🛒 الوجبات المطلوبة:%0A`;
            cart.forEach(item => {
                msg += `- ${item.name} (عدد: ${item.qty}) - ${item.price * item.qty} د.ع%0A`;
            });
            msg += `--------------------------------%0A`;
            msg += `💰 سعر الوجبات: ${itemsPrice} د.ع%0A`;
            msg += `🛵 سعر التوصيل: ${deliveryCost} د.ع%0A`;
            msg += `💵 الإجمالي الكلي: ${finalTotal} د.ع%0A`;

            window.open(`https://wa.me/9647838021664?text=${msg}`, '_blank');
        }
    </script>
</body>
